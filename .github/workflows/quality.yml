name: Accessibility and Lighthouse
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # timeout-ok: `playwright install --with-deps` stalled 375 s on a slow apt mirror on 2026-10-26 (normal run 2.5 min)
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:audit
        env:
          FORCE_COLOR: "1"
      - run: npm run audit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: app/reports
